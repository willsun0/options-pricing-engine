[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-engine"
version = "0.1.0"
description = "A readable options pricing engine: analytics, lattices, simulation, and vol surfaces"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Kept optional so `pip install options-engine` stays light. Phases 1-3 need
# neither; Phase 4 needs `data` only to fetch a fresh chain, and Phase 5 needs
# `ml`. The Phase 5 tests skip cleanly when torch is absent.
data = ["yfinance>=0.2.40"]
ml = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["options_engine*"]

[tool.pytest.ini_options]
testpaths = ["options_engine/tests"]
# Network tests are excluded by default: a suite that fails when a vendor API is
# slow, rate-limited, or unreachable is not a suite you can trust. Run them
# explicitly with `pytest -m network` after upgrading yfinance.
addopts = "-q -m 'not network'"
markers = [
    "network: hits a live market data API (deselected by default)",
]
